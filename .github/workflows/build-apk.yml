name: Build Anime Streaming APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Generate Android project
        # Folder android/ tidak disimpan di repo — di-generate dari template
        # Capacitor di sini (butuh @capacitor/android dari dependencies).
        run: npx cap add android

      - name: Generate Android icons & splash
        # Ikon + splash di-generate dari assets/*.svg (file PNG-nya tidak
        # disimpan di repo). Butuh devDependency @capacitor/assets.
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.3

      # The ubuntu-latest runner already includes the Android SDK
      # (ANDROID_SDK_ROOT=/usr/local/lib/android/sdk). Do NOT add a
      # third-party setup-android step: it broke past builds.
      - name: Accept SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install required SDK packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # NOTE: the Gradle wrapper jar is intentionally NOT in this repo
      # (binary file), so the build uses the Gradle installed above
      # instead of ./gradlew.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-streaming-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
